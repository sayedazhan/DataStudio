<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Data Studio Forms</title></head>
  <body>
    <form name="pro-waitlist" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pro-waitlist">
      <input name="bot-field" type="text">
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="company" type="text">
      <select name="interest">
        <option value="saved-analyses">Saved analyses &amp; history</option>
        <option value="premium-reports">Premium reports</option>
        <option value="automation">Excel / workflow automation</option>
        <option value="ai-intelligence">AI-powered intelligence</option>
        <option value="higher-limits">Higher usage limits</option>
        <option value="business">Business / team use</option>
      </select>
      <input name="product-updates" type="checkbox" value="yes">
    </form>

    <form name="data-studio-contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="data-studio-contact">
      <input name="bot-field" type="text">
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="company" type="text">
      <select name="enquiry-type">
        <option value="custom-dashboard">Custom dashboard</option>
        <option value="white-label">White-label reporting</option>
        <option value="automation">Workflow automation</option>
        <option value="data-analysis">Custom data analysis</option>
        <option value="business-use">Business / team use</option>
        <option value="product-feedback">Product feedback</option>
        <option value="technical-support">Technical support</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
